<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Abhay's Eats | Delicious Cuisine</title>
    <meta name="description" content="Explore the menu at Abhay's Eats. Discover our delicious range of appetizers, main courses, desserts, and drinks inspired by unique flavours.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index.html" class="logo-text">Abhay's Eats</a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <!-- Cart icon/summary placeholder -->
        <div id="cart-icon-container">
            <a href="#cart">
                <img src="assets/images/cart-icon_placeholder.svg" alt="Shopping Cart">
                <span id="cart-item-count">0</span>
            </a>
        </div>
    </header>

    <main>
        <section id="menu-hero">
            <h2>Our Menu</h2>
            <p>Freshly prepared, flavour-packed dishes. Find your new favorite!</p>
        </section>

        <section id="menu-controls">
            <div class="category-tabs">
                <!-- Placeholder for category tabs (e.g., All, Burgers, Sides, Drinks) -->
                <button class="category-tab active" data-category="all">All</button>
                <button class="category-tab" data-category="main">Mains</button>
                <button class="category-tab" data-category="sides">Sides</button>
                <button class="category-tab" data-category="drinks">Drinks</button>
            </div>
            <div class="filter-chips">
                <!-- Placeholder for filter chips (e.g., Spicy, Vegetarian) -->
                <span class="filter-chip" data-filter="vegetarian">Vegetarian</span>
                <span class="filter-chip" data-filter="spicy">Spicy</span>
            </div>
        </section>

        <section id="menu-listing">
            <div id="menu-items-container">
                <!-- Menu items will be loaded here by js/menu.js from data/menu.json -->
                <!-- Example structure for a single menu item (to be generated by JS) -->
                <!--
                <article class="menu-item" data-id="ITEM_ID_HERE">
                    <img src="assets/images/menu-item-placeholder.jpg" alt="ITEM_NAME_HERE">
                    <h3>ITEM_NAME_HERE</h3>
                    <p class="item-description">ITEM_DESCRIPTION_HERE</p>
                    <p class="item-price">$PRICE_HERE</p>
                    <div class="item-actions">
                        <label for="quantity-ITEM_ID_HERE">Quantity:</label>
                        <input type="number" id="quantity-ITEM_ID_HERE" name="quantity" value="1" min="1">
                        <button class="add-to-cart-btn" data-id="ITEM_ID_HERE">Add to Cart</button>
                    </div>
                    <button class="nutrition-modal-trigger" data-id="ITEM_ID_HERE">View Nutrition</button>
                </article>
                -->
            </div>
        </section>
        
        <!-- Slide-in Cart Placeholder -->
        <aside id="slide-in-cart" class="cart-hidden">
            <h2>Your Order</h2>
            <div id="cart-items-container">
                <!-- Cart items will be populated here by js/cart.js -->
            </div>
            <div id="cart-summary">
                <p>Total: <span id="cart-total">$0.00</span></p>
                <button id="checkout-button" class="button-primary">Checkout</button>
            </div>
            <button id="close-cart-btn">Close Cart</button>
        </aside>

        <!-- Modal Nutrition Panel Placeholder -->
        <div id="nutrition-modal" class="modal-hidden">
            <div class="modal-content">
                <button id="close-nutrition-modal-btn">&times;</button>
                <h3>Nutrition Information</h3>
                <div id="nutrition-details">
                    <!-- Nutrition details will be populated here -->
                </div>
            </div>
        </div>

    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 Abhay's Eats. All Rights Reserved.</p>
            <p>123 Douglas St, Victoria, BC, V8W 2B4</p>
        </div>
    </footer>

    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
